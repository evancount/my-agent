name: Update Fund Simulator Data

on:
  schedule:
    # 每月 20 日 UTC 02:00 (台灣時間 10:00) 執行
    # 選 20 日是因為當月配息資料通常在 15-18 日公布
    - cron: '0 2 20 * *'
  workflow_dispatch: # 也可以手動觸發

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Fetch latest fund data
        run: python scripts/update_fund_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes" && exit 0
          git add fund-simulator.html "安聯收益成長基金投資模擬器.html"
          git commit -m "auto: update fund NAV/dividend data $(date +%Y-%m)"
          git push
